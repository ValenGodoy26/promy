<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFBE00" />

    <!-- Primary Meta -->
    <title>PROMY · Promos reales, cerca tuyo</title>
    <meta
      name="description"
      content="PROMY es una app de promociones reales para Concordia, Entre Ríos. Descubrí descuentos, beneficios y comercios locales cerca tuyo desde el celular."
    />
    <meta
      name="keywords"
      content="PROMY, promociones Concordia, descuentos Concordia, comercios Concordia, beneficios locales, app de promociones, promos cerca tuyo, Entre Ríos"
    />
    <meta name="author" content="PROMY" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://promy.app/" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/promy-logo-square.png" />
    <link rel="apple-touch-icon" href="/promy-logo-square.png" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PROMY" />
    <meta property="og:url" content="https://promy.app/" />
    <meta property="og:title" content="PROMY · Promos reales, cerca tuyo" />
    <meta
      property="og:description"
      content="Descubrí promociones, descuentos y beneficios reales de comercios locales de Concordia. Sin cupones raros, sin vueltas. Abrís la app, elegís y mostrás la promo."
    />
    <meta property="og:image" content="https://promy.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="PROMY — Promos reales cerca tuyo en Concordia."
    />
    <meta property="og:locale" content="es_AR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PROMY · Promos reales, cerca tuyo" />
    <meta
      name="twitter:description"
      content="Promociones y beneficios reales de comercios locales de Concordia. Abrí la app y descubrí qué tenés cerca."
    />
    <meta name="twitter:image" content="https://promy.app/og-image.png" />
    <meta name="twitter:image:alt" content="PROMY — Promos reales cerca tuyo" />

    <!-- Structured Data: SoftwareApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MobileApplication",
        "name": "PROMY",
        "description": "App de promociones y beneficios reales en comercios locales de Concordia, Entre Ríos.",
        "operatingSystem": "iOS, Android",
        "applicationCategory": "LifestyleApplication",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "ARS"
        },
        "url": "https://promy.app",
        "image": "https://promy.app/og-image.png",
        "inLanguage": "es-AR",
        "areaServed": [
          {
            "@type": "City",
            "name": "Concordia",
            "address": {
              "@type": "PostalAddress",
              "addressRegion": "Entre Ríos",
              "addressCountry": "AR"
            }
          }
        ]
      }
    </script>

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "PROMY",
        "url": "https://promy.app",
        "logo": "https://promy.app/promy-logo-square.png",
        "email": "hola@promy.app",
        "sameAs": [
          "https://instagram.com/promy.app",
          "https://tiktok.com/@promy.app"
        ]
      }
    </script>

    <!-- Preconnect to font providers for faster first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
