name: promy-api-ci

on:
  push:
    paths:
      - "promy-api/**"
      - ".github/workflows/promy-api-ci.yml"
  pull_request:
    paths:
      - "promy-api/**"
      - ".github/workflows/promy-api-ci.yml"

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: promy-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: "npm"
          cache-dependency-path: promy-api/package-lock.json
      - run: npm ci
      - run: npm run check

  integration:
    if: ${{ secrets.PROMY_API_TEST_DATABASE_URL != '' }}
    runs-on: ubuntu-latest
    needs: unit
    defaults:
      run:
        working-directory: promy-api
    env:
      TEST_DATABASE_URL: ${{ secrets.PROMY_API_TEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: "npm"
          cache-dependency-path: promy-api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:integration
