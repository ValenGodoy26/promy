name: promy-api-ci

on:
  push:
    paths:
      - "promy-api/**"
      - ".github/workflows/promy-api-ci.yml"
  pull_request:
    paths:
      - "promy-api/**"
      - ".github/workflows/promy-api-ci.yml"

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: promy-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: "npm"
          cache-dependency-path: promy-api/package-lock.json
      - run: npm ci
      - run: npm run check

  integration:
    runs-on: ubuntu-latest
    needs: unit
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: promy_test_root
          MYSQL_DATABASE: promy_integration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -ppromy_test_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: promy-api
    env:
      TEST_DATABASE_URL: mysql://root:promy_test_root@127.0.0.1:3306/promy_integration_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: "npm"
          cache-dependency-path: promy-api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:integration
