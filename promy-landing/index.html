<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFBE00" />

    <!-- Primary Meta -->
    <title>PROMY · Promos reales, cerca tuyo</title>
    <meta
      name="description"
      content="PROMY está preparando su lanzamiento en Concordia, Entre Ríos. Descubrí promociones y beneficios de comercios locales y pedí acceso anticipado para iPhone o Android."
    />
    <meta
      name="keywords"
      content="PROMY, promociones Concordia, descuentos Concordia, comercios Concordia, beneficios locales, app de promociones, promos cerca tuyo, Entre Ríos"
    />
    <meta name="author" content="PROMY" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://promy.app/" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PROMY" />
    <meta property="og:url" content="https://promy.app/" />
    <meta property="og:title" content="PROMY · Promos reales, cerca tuyo" />
    <meta
      property="og:description"
      content="PROMY llega primero a Concordia. Conocé promociones de comercios locales y pedí acceso anticipado para iPhone o Android."
    />
    <meta property="og:image" content="https://promy.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="PROMY — Promos reales cerca tuyo en Concordia."
    />
    <meta property="og:locale" content="es_AR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PROMY · Promos reales, cerca tuyo" />
    <meta
      name="twitter:description"
      content="PROMY llega primero a Concordia. Conocé promociones locales y pedí acceso anticipado para iPhone o Android."
    />
    <meta name="twitter:image" content="https://promy.app/og-image.png" />
    <meta name="twitter:image:alt" content="PROMY — Promos reales cerca tuyo" />

    <!-- Structured Data: pre-launch website -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "PROMY",
        "url": "https://promy.app/",
        "description": "Sitio de pre-lanzamiento de PROMY, una plataforma de promociones locales que comienza en Concordia, Entre Ríos.",
        "inLanguage": "es-AR"
      }
    </script>

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "PROMY",
        "url": "https://promy.app",
        "logo": "https://promy.app/promy-logo-square.webp",
        "email": "hola@promy.app"
      }
    </script>

    <!-- Preconnect to font providers for faster first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400..700;1,500..700&display=swap"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-mono/style.css" />

    <!-- Discover the above-the-fold product image before React mounts. -->
    <link rel="preload" as="image" href="/hero-app-feed.webp" fetchpriority="high" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
